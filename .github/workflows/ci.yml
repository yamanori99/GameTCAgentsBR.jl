name: CI

# Checkout Pkg.test: 1.13 (coverage), 1.14-pre, nightly.
# Registry install: Pkg.add the head commit the way General does, then Pkg.test.
# 1.14-pre and nightly are continue-on-error.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  test:
    name: GameTCAgentsBR (1.13, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: true
      - uses: julia-actions/julia-processcoverage@v1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: true

  test-1-14-pre:
    name: GameTCAgentsBR (1.14-pre, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '~1.14.0-0'
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  test-nightly:
    name: GameTCAgentsBR (nightly, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: nightly
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  registry-install:
    name: Registry install (1.13, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
      - uses: ./.github/actions/registry-install
        with:
          package: GameTCAgentsBR
          rev: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  aqua:
    name: Aqua (1.13, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh
