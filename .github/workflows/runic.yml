name: Runic

# Light `--check`. Not a substitute for Pkg.test or JETLS.
# `version: '1'`: a Runic minor can fail this job.
on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  runic:
    name: Runic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
